services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /srv/caddy/conf:/etc/caddy/:ro
      - /srv/caddy/site:/srv
      - /srv/caddy/data:/data
      - /srv/caddy/config:/config
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true

services:
  kopia:
    image: kopia/kopia:20260927.0.53511
    container_name: kopia
    hostname: kopia
    restart: unless-stopped
    ports:
      - "51515:51515"
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=admin
      - --server-password=ChangeMeWebUISecret
    environment:
      # Master Encryption Key for Google Drive Repository
      KOPIA_PASSWORD: "ChangeMeMasterRepoPassword"
      USER: "yasir"
    volumes:
      # Kopia Internal Configuration & State (Persisted in /srv/kopia)
      - /srv/kopia/config:/app/config
      - /srv/kopia/cache:/app/cache
      - /srv/kopia/logs:/app/logs

      # Google Drive Credentials (JSON key file)
      - /srv/kopia/gdrive-key.json:/app/gdrive-key.json:ro

      # Host Data Mounts to Backup (Read-Only)
      - /srv:/data:ro

      # Shared mount directory for browsing/restoring past snapshots
      - /srv/kopia/tmp:/tmp:shared

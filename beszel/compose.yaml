services:
  beszel:
    image: henrygd/beszel:0.19
    container_name: beszel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BESZEL_PORT}:8090"
    environment:
      - APP_URL=${BESZEL_APP_URL}
      - TRUSTED_AUTH_HEADER=${BESZEL_TRUSTED_AUTH_HEADER}
    volumes:
      - /srv/beszel/beszel_data:/beszel_data
    networks:
      - caddy_default

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/beszel/beszel_agent_data:/var/lib/beszel-agent
    environment:
      LISTEN: ${AGENT_LISTEN_PORT}
      KEY: ${AGENT_KEY}
      TOKEN: ${AGENT_TOKEN}
      HUB_URL: ${AGENT_HUB_URL}

networks:
  caddy_default:
    external: true
